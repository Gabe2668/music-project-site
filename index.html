<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Music Reviews</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="logo-container">
      <h1>MELONDY</h1>
      <a href="create.html" class="create-btn">+ Create Review</a>
    </div>
  </header>

  <main>
    <div class="filters">
      <button onclick="filterBy('ALL')" class="active">ALL</button>
      <button onclick="filterBy('CLASSIC')">CLASSIC</button>
      <button onclick="filterBy('10/10')">10/10</button>
      <button onclick="filterBy('9/10')">9/10</button>
      <button onclick="filterBy('8/10')">8/10</button>
      <button onclick="filterBy('7/10')">7/10</button>
      <button onclick="filterBy('6/10')">6/10</button>
      <button onclick="filterBy('5/10')">5/10</button>
      <button onclick="filterBy('4/10')">4/10</button>
      <button onclick="filterBy('3/10')">3/10</button>
      <button onclick="filterBy('2/10')">2/10</button>
      <button onclick="filterBy('1/10')">1/10</button>
      <button onclick="filterBy('0/10')">0/10</button>
      <button onclick="filterBy('NOT GOOD')">NOT GOOD</button>
    </div>

    <div id="reviews-grid"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="fetch.js"></script>
</body>
</html>
