<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Create Review</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="form-container">
    <div class="form-header">
      <h2>Post New Review</h2>
      <a href="index.html" class="back-link">← Back to Home</a>
    </div>
    
    <form id="review-form">
      <label for="spotify-id">Spotify Album Link or ID:</label>
      <input type="text" id="spotify-id" placeholder="e.g. https://open.spotify.com/album/..." required />

      <label for="rating">Rating Badge:</label>
      <select id="rating" name="rating">
        <option value="CLASSIC">CLASSIC/10</option>
        <option value="10/10">10/10</option>
        <option value="9/10">9/10</option>
        <option value="8/10">8/10</option>
        <option value="7/10">7/10</option>
        <option value="6/10">6/10</option>
        <option value="5/10">5/10</option>
        <option value="4/10">4/10</option>
        <option value="3/10">3/10</option>
        <option value="2/10">2/10</option>
        <option value="1/10">1/10</option>
        <option value="0/10">0/10</option>
        <option value="NOT GOOD">NOT GOOD</option>
        <option value="OTHER">OTHER SCORES</option>
        <option value="NO SCORE">NO SCORE</option>
      </select>

      <label for="review-body">Review Text:</label>
      <textarea id="review-body" rows="6" placeholder="Write your thoughts..." required></textarea>

      <button type="submit" id="submit-btn">Publish Review</button>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="posting.js"></script>
</body>
</html>
